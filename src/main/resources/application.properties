spring.application.name=pizzas
server.port=8080

# Base de datos en memoria (H2). Los datos viven mientras la aplicacion este corriendo.
spring.datasource.url=jdbc:h2:mem:pizzas;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate crea las tablas a partir de las entidades
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Consola web de H2 -> http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Errores mas claros en desarrollo
server.error.include-message=always

# Las vistas del panel de administracion son estaticas (src/main/resources/static)
spring.thymeleaf.check-template-location=false
